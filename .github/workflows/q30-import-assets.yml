name: Q30 one-time original texture import
on:
  push:
    branches: [quick/q30-starstrike]
    paths:
      - '.github/workflows/q30-import-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quick/q30-starstrike
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download and transcode 14.14 StarStrike textures
        run: node tools/q30/fetch_starstrike_14_14.mjs
      - name: Verify image format and completeness
        run: node tools/q30/verify_assets.mjs
      - name: Record hashes and commit source-constrained assets
        run: |
          find public/assets/weapons/vfx/starstrike -name '*.webp' -type f -print0 | sort -z | xargs -0 sha256sum > public/assets/weapons/vfx/starstrike/SHA256SUMS.txt
          git add public/assets/weapons/vfx/starstrike
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[Quick Q-30 / GPT-16] Add 14 verified Patch 14.14 StarStrike textures'
            git push origin HEAD:quick/q30-starstrike
          fi
