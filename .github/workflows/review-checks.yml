name: Review checks
on:
  push:
    branches: ["review/**", "quick/**", "gemini/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: StarStrike numerical tests
        run: npx tsx tools/q30-starstrike.test.ts
      - name: Q30 release asset gate
        run: node tools/q30/verify_assets.mjs
